<!DOCTYPE html>
<html lang="en" class="dark">

  <title>CastFlow Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            canvas: '#090d16',
            card: '#111827',
            cardAlt: '#1e293b',
            surface: '#0f172a'
          }
        }
      }
    };
  </script>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      background-color: #090d16;
      color: #f8fafc;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }
    .ad-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        45deg,
        rgba(245, 158, 11, 0.55),
        rgba(245, 158, 11, 0.55) 4px,
        rgba(217, 119, 6, 0.25) 4px,
        rgba(217, 119, 6, 0.25) 8px
      );
      pointer-events: none;
    }
    .toggle-checkbox:checked + .toggle-track {
      background-color: #4f46e5;
    }
    .toggle-checkbox:checked + .toggle-track .toggle-thumb {
      transform: translateX(18px);
    }
  </style>
</head>
<body class="min-h-screen bg-canvas text-slate-100">
  <!-- Main Mobile Container -->
  <div class="w-full max-w-md mx-auto min-h-screen flex flex-col justify-between px-4 pt-4 pb-24">
    <div>
      <!-- Top Header -->
      <header class="flex items-center justify-between gap-2 pb-4 border-b border-slate-800/80">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-lg font-extrabold tracking-tight text-white">CastFlow Pro</h1>
            <span id="adSavedPill" class="font-mono text-[11px] px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30">
              0s ads skipped
            </span>
            <span id="syncStatusPill" class="font-mono text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
              Synced
            </span>
          </div>
          <p id="headerShowLabel" class="text-xs text-slate-400 truncate mt-0.5">Tech Frontier Weekly</p>
        </div>
        <button id="carModeBtn" type="button" class="px-3 py-2 rounded-xl bg-card hover:bg-cardAlt border border-slate-800 text-xs font-bold text-indigo-300 shrink-0">
          🚗 Drive
        </button>
      </header>

      <!-- Toast Notification -->
      <div id="toastBanner" class="hidden mt-3 flex items-center justify-between gap-2 px-3.5 py-2.5 rounded-2xl bg-indigo-950/90 border border-indigo-500/40 text-xs text-white shadow-lg">
        <span id="toastMessage" class="truncate flex-1 font-medium"></span>
        <button id="toastUndoBtn" type="button" class="hidden px-2.5 py-1 rounded-lg bg-amber-400 text-slate-950 font-bold text-[11px] shrink-0">
          Undo Ad
        </button>
      </div>

      <!-- VIEW 1: PLAYER -->
      <main id="viewPlayer" class="mt-4 space-y-4">
        <section class="p-4 rounded-2xl bg-card border border-slate-800/90 space-y-4">
          <div class="flex items-center gap-3.5">
            <div id="epArtwork" class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-600/30 to-purple-600/20 border border-indigo-500/30 flex items-center justify-center text-3xl shrink-0">

            </div>
            <div class="min-w-0 flex-1">
              <p id="epTitle" class="text-sm font-bold text-white leading-snug line-clamp-2">Loading episode...</p>
              <p id="epShowMeta" class="text-xs text-slate-400 truncate mt-1">Show • 30 min</p>
            </div>
          </div>

          <!-- Scrubber with Ad Markers -->
          <div class="space-y-1.5">
            <div id="scrubberTrack" class="relative h-3.5 rounded-full bg-surface border border-slate-800 overflow-hidden cursor-pointer">
              <div id="adMarkersLayer" class="absolute inset-0"></div>
              <div id="progressFill" class="relative h-full w-0 bg-indigo-500 rounded-full transition-[width] duration-75"></div>
            </div>
            <div class="flex items-center justify-between font-mono text-[11px] text-slate-400">
              <span id="currentTimeLabel">0:00</span>
              <span id="durationLabel">30:00</span>
            </div>
          </div>

          <!-- Main Transport Controls -->
          <div class="flex items-center justify-center gap-4 pt-1">
            <button id="rewind15Btn" type="button" class="px-4 py-3 rounded-2xl bg-surface hover:bg-cardAlt border border-slate-800 text-xs font-bold text-slate-200 active:scale-95 transition">
              -15s
            </button>
            <button id="playPauseBtn" type="button" class="w-16 h-16 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white text-xl font-bold shadow-lg shadow-indigo-600/30 flex items-center justify-center active:scale-95 transition">
              ▶
            </button>
            <button id="forward30Btn" type="button" class="px-4 py-3 rounded-2xl bg-surface hover:bg-cardAlt border border-slate-800 text-xs font-bold text-slate-200 active:scale-95 transition">
              +30s
            </button>
          </div>
        </section>

        <!-- Speed & Smart Audio Toggles -->
        <section class="p-4 rounded-2xl bg-card border border-slate-800/90 space-y-3.5">
          <div class="flex items-center justify-between">
            <label for="speedRange" class="text-xs font-bold text-slate-200">Playback Speed</label>
            <span id="speedValueLabel" class="font-mono text-xs font-bold text-indigo-300">1.00x</span>

          <input id="speedRange" type="range" min="0.5" max="2.0" step="0.05" value="1.0" class="w-full accent-indigo-500 cursor-pointer" />

          <div class="pt-2 border-t border-slate-800/80 space-y-3">
            <label class="flex items-center justify-between gap-3 cursor-pointer">
              <div>
                <p class="text-xs font-bold text-white">Auto-Skip Commercials</p>
                <p class="text-[11px] text-slate-400">Automatically jump past detected ad breaks</p>
              </div>
              <span class="relative inline-flex items-center shrink-0">
                <input id="toggleAutoSkipAds" type="checkbox" class="sr-only toggle-checkbox" checked />
                <span class="toggle-track w-10 h-6 bg-slate-700 rounded-full transition-colors relative">
                  <span class="toggle-thumb w-4 h-4 bg-white rounded-full absolute top-1 left-1 transition-transform"></span>
                </span>
              </span>
            </label>

            <label class="flex items-center justify-between gap-3 cursor-pointer">
              <div>
                <p class="text-xs font-bold text-white">Silence Trim / Leveler</p>
                <p class="text-[11px] text-slate-400">Smooth volume dynamics for noisy environments</p>
              </div>
              <span class="relative inline-flex items-center shrink-0">
                <input id="toggleSilenceTrim" type="checkbox" class="sr-only toggle-checkbox" />
                <span class="toggle-track w-10 h-6 bg-slate-700 rounded-full transition-colors relative">
                  <span class="toggle-thumb w-4 h-4 bg-white rounded-full absolute top-1 left-1 transition-transform"></span>
                </span>
              </span>

              <div>
                <p class="text-xs font-bold text-white">Voice Boost</p>
                <p class="text-[11px] text-slate-400">Enhance vocal clarity on spoken-word shows</p>
              </div>
              <span class="relative inline-flex items-center shrink-0">
                <input id="toggleVoiceBoost" type="checkbox" class="sr-only toggle-checkbox" />
                <span class="toggle-track w-10 h-6 bg-slate-700 rounded-full transition-colors relative">
                  <span class="toggle-thumb w-4 h-4 bg-white rounded-full absolute top-1 left-1 transition-transform"></span>
                </span>

            </label>

      <!-- VIEW 2: QUEUE -->

            <h2 class="text-sm font-extrabold text-white">Up Next Queue</h2>

          </div>
          <div id="queueList" class="space-y-2"></div>
        </div>
      </section>

      <!-- VIEW 3: LIBRARY -->
      <section id="viewLibrary" class="hidden mt-4 space-y-3">
        <!-- Follow Show / Apple Link / RSS -->
        <div class="p-4 rounded-2xl bg-card border border-slate-800/90 space-y-2.5">
          <label for="libraryFeedInput" class="block text-xs font-extrabold text-white">

          </label>
          <div class="flex items-center gap-2">
            <input

              Follow
            </button>
          </div>
        </div>

        <!-- Search, Filter, Sort & Hide Listened -->
        <div class="p-4 rounded-2xl bg-card border border-slate-800/90 space-y-2.5">
          <input
            id="librarySearchInput"
            type="text"
            placeholder="Search shows or episodes..."
            class="w-full px-3 py-2.5 rounded-xl bg-surface border border-slate-700 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
          />
          <div class="flex items-center gap-1.5">
            <button id="filterAllBtn" type="button" class="flex-1 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white">All</button>
            <button id="filterShowsBtn" type="button" class="flex-1 py-2 rounded-xl text-xs font-bold bg-surface text-slate-400">Shows</button>
            <button id="filterSavedBtn" type="button" class="flex-1 py-2 rounded-xl text-xs font-bold bg-surface text-slate-400">Saved Eps</button>
          </div>
          <div class="flex items-center gap-2 pt-1">
            <button id="librarySortBtn" type="button" class="flex-1 py-2 px-3 rounded-xl bg-surface hover:bg-cardAlt border border-slate-800 text-xs font-bold text-indigo-300 text-left">

            </button>
            <button id="toggleHideListenedBtn" type="button" class="flex-1 py-2 px-3 rounded-xl bg-surface hover:bg-cardAlt border border-slate-800 text-xs font-bold text-slate-300 text-left">
              👁️ Hide Listened: OFF
            </button>
          </div>
        </div>

        <!-- Subscribed Shows -->
        <div class="p-4 rounded-2xl bg-card border border-slate-800/90 space-y-2.5">
          <div class="flex items-center justify-between">
            <h2 class="text-sm font-extrabold text-white">Subscribed Shows</h2>
            <span id="subscribedShowsCount" class="font-mono text-xs text-slate-400">0 shows</span>
          </div>
          <div id="subscribedShowsList" class="space-y-2"></div>
        </div>

        <!-- Episodes List -->
        <div class="p-4 rounded-2xl bg-card border border-slate-800/90 space-y-2.5">
          <h2 class="text-sm font-extrabold text-white">Episodes</h2>
          <div id="libraryEpisodesList" class="space-y-2"></div>
        </div>

        <!-- Cross-Device Sync Key -->
        <div class="p-4 rounded-2xl bg-card border border-slate-800/90 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-extrabold text-white">Cross-Device Sync Key</span>
            <button id="copySyncKeyBtn" type="button" class="px-2.5 py-1 rounded-lg bg-surface hover:bg-cardAlt border border-slate-700 text-[11px] font-bold text-indigo-300">
              Copy Link
            </button>
          </div>
          <div class="flex items-center gap-2">
            <input
              id="syncKeyInput"
              type="text"
              placeholder="Sync key"
              class="flex-1 min-w-0 px-3 py-2 rounded-xl bg-surface border border-slate-700 font-mono text-xs text-slate-200 focus:outline-none focus:border-indigo-500"
            />
            <button id="applySyncKeyBtn" type="button" class="px-3 py-2 rounded-xl bg-cardAlt hover:bg-slate-700 text-xs font-bold text-white shrink-0">
              Sync
            </button>
          </div>
        </div>
      </section>

      <!-- VIEW 4: CHAPTERS & NOTES -->
      <section id="viewExtras" class="hidden mt-4 space-y-3">
        <div class="p-4 rounded-2xl bg-card border border-slate-800/90 space-y-2.5">
          <h2 class="text-sm font-extrabold text-white">Chapters</h2>
          <div id="chaptersList" class="space-y-2"></div>
        </div>

        <div class="p-4 rounded-2xl bg-card border border-slate-800/90 space-y-2.5">
          <h2 class="text-sm font-extrabold text-white">Bookmarks & Notes</h2>
          <div class="flex items-center gap-2">
            <input
              id="bookmarkNoteInput"
              type="text"
              placeholder="Note at current timestamp..."
              class="flex-1 min-w-0 px-3 py-2 rounded-xl bg-surface border border-slate-700 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
            />
            <button id="addBookmarkBtn" type="button" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-bold text-white shrink-0">
              + Pin
            </button>
          </div>
          <div id="bookmarksList" class="space-y-2 pt-1"></div>
        </div>
      </section>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-30 bg-card/95 backdrop-blur border-t border-slate-800">
      <div class="max-w-md mx-auto grid grid-cols-4 gap-1 px-2 py-2">
        <button id="tabPlayerBtn" type="button" class="flex flex-col items-center justify-center py-2 rounded-xl bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 text-xs font-bold">
          <span>🎧</span>
          <span class="mt-0.5 text-[11px]">Player</span>
        </button>
        <button id="tabQueueBtn" type="button" class="flex flex-col items-center justify-center py-2 rounded-xl text-slate-400 hover:text-white text-xs font-semibold">
          <span>📋</span>
          <span class="mt-0.5 text-[11px]">Queue</span>
        </button>
        <button id="tabLibraryBtn" type="button" class="flex flex-col items-center justify-center py-2 rounded-xl text-slate-400 hover:text-white text-xs font-semibold">
          <span>📚</span>
          <span class="mt-0.5 text-[11px]">Library</span>
        </button>
        <button id="tabExtrasBtn" type="button" class="flex flex-col items-center justify-center py-2 rounded-xl text-slate-400 hover:text-white text-xs font-semibold">
          <span>🔖</span>
          <span class="mt-0.5 text-[11px]">Notes</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- Drive / Car Mode Overlay -->
  <div id="carModeOverlay" class="hidden fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-between p-6 text-center">
    <div class="w-full max-w-md flex items-center justify-between">
      <span class="font-mono text-xs uppercase tracking-wider text-indigo-400">Drive Mode</span>
      <button id="exitCarModeBtn" type="button" class="px-4 py-2 rounded-xl bg-card border border-slate-800 text-xs font-bold text-white">
        Exit
      </button>
    </div>

    <div class="w-full max-w-md space-y-2 my-auto">
      <p id="carModeShow" class="text-xs font-semibold text-indigo-300 uppercase tracking-wide">Show</p>
      <h2 id="carModeTitle" class="text-xl font-extrabold text-white leading-snug">Episode Title</h2>
    </div>

    <div class="w-full max-w-md flex items-center justify-center gap-5 pb-6">
      <button id="carRewindBtn" type="button" class="px-5 py-4 rounded-2xl bg-card border border-slate-800 text-sm font-extrabold text-white active:scale-95">
        -15s
      </button>
      <button id="carModePlayBtn" type="button" class="w-24 h-24 rounded-full bg-indigo-600 text-white text-3xl font-bold shadow-xl active:scale-95">
        ▶
      </button>
      <button id="carForwardBtn" type="button" class="px-5 py-4 rounded-2xl bg-card border border-slate-800 text-sm font-extrabold text-white active:scale-95">
        +30s
      </button>
    </div>
  </div>

  <audio id="audioElement" preload="metadata"></audio>

    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : '';

    let db = null;
    let auth = null;
    let currentUser = null;
    let unsubscribeCloudDoc = null;
    let isApplyingRemoteState = false;

      try {
        if (!rawFirebaseConfig) {
          updateSyncStatusUI('Local Only');
          return null;
        }
        const firebaseConfig = JSON.parse(rawFirebaseConfig);
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        if (initialAuthToken) {
          const cred = await signInWithCustomToken(auth, initialAuthToken);
          currentUser = cred.user;
        } else {
          const cred = await signInAnonymously(auth);
          currentUser = cred.user;
        }
        updateSyncStatusUI('Synced');
        return currentUser;
      } catch (_) {
        updateSyncStatusUI('Local Only');
        return null;
      }
    }

      return doc(db, 'artifacts', appId, 'public', 'data', 'castflow_sync_profiles', safeKey);

    const KEYVALUE_API = 'https://keyvalue.immanuel.co/api/KeyVal';
    const JSONBLOB_API = 'https://jsonblob.com/api/jsonBlob';

      const bodyObj = {

      };
      const serializedBody = JSON.stringify(bodyObj);
      let anySucceeded = false;

      // 1. KeyValue public store keyed by baseSyncKey (works without needing a blobId first)
      try {
        const kvKey = encodeURIComponent(cloudBucketForKey(cleanKey));
        const encodedVal = encodeURIComponent(serializedBody);
        let upRes = await fetch(`${KEYVALUE_API}/UpdateValue/${kvKey}/${encodedVal}?t=${Date.now()}`, {

          cache: 'no-store'
        });
        if (!upRes.ok) {
          await fetch(`${KEYVALUE_API}/Init/${kvKey}/empty?t=${Date.now()}`, {
            method: 'POST',
            cache: 'no-store'
          });
          upRes = await fetch(`${KEYVALUE_API}/UpdateValue/${kvKey}/${encodedVal}?t=${Date.now()}`, {

          });
        }
        if (upRes.ok) {

        }
      } catch (_) {}

      // 2. JSONBlob store (persists exact blobId inside the Sync Key)
      try {
        if (blobId) {
          const putRes = await fetch(`${JSONBLOB_API}/${encodeURIComponent(blobId)}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            cache: 'no-store',
            body: serializedBody
          });
          if (putRes.ok) {
            anySucceeded = true;
          }
        } else {
          const createRes = await fetch(JSONBLOB_API, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            cache: 'no-store',
            body: serializedBody
          });
          if (createRes.ok) {
            const locationHeader = createRes.headers.get('X-JsonBlob-Id') || createRes.headers.get('Location') || '';
            let createdId = '';
            const idMatch = locationHeader.match(/([a-zA-Z0-9-]{8,})\/?$/);
            if (idMatch) {
              createdId = idMatch[1];
            } else {
              try {
                const createdJson = await createRes.json();
                createdId = String(createdJson?.id || '').trim();
              } catch (_) {}
            }

            if (createdId) {
              const combinedKey = formatCombinedSyncKey(baseKey, createdId);
              setActiveSyncKeyUI(combinedKey);

            }
          }
        }
      } catch (_) {}

      return anySucceeded;

    async function pullFallbackSyncState(key) {
      const cleanKey = String(key || '').trim();
      if (!cleanKey) return null;
      const { blobId } = parseSyncKeyParts(cleanKey);
      const candidates = [];

      try {
        const kvKey = encodeURIComponent(cloudBucketForKey(cleanKey));
        const kvRes = await fetch(`${KEYVALUE_API}/GetValue/${kvKey}?t=${Date.now()}`, {
          method: 'GET',
          cache: 'no-store'
        });
        if (kvRes.ok) {
          const rawText = await kvRes.text();
          let unquoted = rawText ? rawText.trim() : '';
          if (unquoted.startsWith('"') && unquoted.endsWith('"')) {
            try { unquoted = JSON.parse(unquoted); } catch (_) {}
          }
          if (typeof unquoted === 'string' && unquoted.trim().startsWith('{')) {
            const parsedKv = JSON.parse(unquoted);
            if (parsedKv && typeof parsedKv === 'object') {
              candidates.push(parsedKv);
            }
          }
        }
      } catch (_) {}

      if (blobId) {
        try {
          const res = await fetch(`${JSONBLOB_API}/${encodeURIComponent(blobId)}?t=${Date.now()}`, {
            method: 'GET',
            headers: { 'Accept': 'application/json' },
            cache: 'no-store'
          });
          if (res.ok) {
            const parsed = await res.json();
            if (parsed && typeof parsed === 'object') {
              candidates.push(parsed);
            }
          }
        } catch (_) {}
      }

      if (!candidates.length) return null;
      candidates.sort((a, b) => (Number(b.updatedAt) || 0) - (Number(a.updatedAt) || 0));
      return candidates[0];
    }

      try {
        if (!currentUser && rawFirebaseConfig) {
          await initFirebaseSync();
        }
        const docRef = getSyncDocRef(key);
        if (docRef && currentUser) {
          updateSyncStatusUI('Syncing...');
          await setDoc(docRef, {
            ...payload,
            syncKey: key,
            updatedAt: Number(payload.updatedAt) || Date.now()
          }, { merge: true });
          updateSyncStatusUI('Synced');
          return;
        }

        updateSyncStatusUI('Syncing...');
        const ok = await pushFallbackSyncState(key, payload);
        updateSyncStatusUI(ok ? 'Synced' : 'Local Only');
      } catch (_) {
        updateSyncStatusUI('Local Only');
      }
    }

    function applyIncomingRemotePayload(remote) {
      if (!remote || typeof remote !== 'object') return;
      const localUpdated = Number(prefs.updatedAt) || 0;
      const remoteUpdated = Number(remote.updatedAt) || 0;
      const localHasCustomShows =
        Array.isArray(prefs.subscribedShows) &&
        !(prefs.subscribedShows.length === 2 &&
          prefs.subscribedShows[0]?.name === 'Tech Frontier Weekly' &&
          prefs.subscribedShows[1]?.name === 'Midnight Mystery Files');
      const remoteHasCustomShows =
        Array.isArray(remote.subscribedShows) &&
        !(remote.subscribedShows.length === 2 &&
          remote.subscribedShows[0]?.name === 'Tech Frontier Weekly' &&
          remote.subscribedShows[1]?.name === 'Midnight Mystery Files');

      const shouldApply =
        remoteUpdated > localUpdated ||
        (remoteHasCustomShows && !localHasCustomShows) ||
        JSON.stringify(remote.subscribedShows || []) !== JSON.stringify(prefs.subscribedShows || []) ||
        JSON.stringify(remote.playedEpisodeIds || []) !== JSON.stringify(prefs.playedEpisodeIds || []) ||
        remote.librarySortOrder !== prefs.librarySortOrder ||
        Boolean(remote.hideListened) !== Boolean(prefs.hideListened);

      if (shouldApply) {
        isApplyingRemoteState = true;
        try {
          const prevShowNames = new Set((prefs.subscribedShows || []).map(s => (s?.name || '').toLowerCase()));
          applyParsedPrefs(remote);
          localStorage.setItem(STORAGE_KEY_PREFIX + activeSyncKey, JSON.stringify(serializeSyncPayload()));
          syncControlsFromPrefs();
          renderLibrary();
          renderQueue();
          switchTab(prefs.activeTab || 'player');
          (prefs.subscribedShows || []).forEach(show => {
            if (show && show.name && !prevShowNames.has(show.name.toLowerCase())) {
              loadEpisodesForShow(show);
            }
          });
        } finally {
          isApplyingRemoteState = false;
        }
      }
    }

    function subscribeToCloudKey(key) {
      if (unsubscribeCloudDoc) {
        try { unsubscribeCloudDoc(); } catch (_) {}
        unsubscribeCloudDoc = null;
      }
      const docRef = getSyncDocRef(key);
      if (docRef && currentUser) {
        unsubscribeCloudDoc = onSnapshot(
          docRef,
          (snap) => {
            if (snap && snap.exists()) {
              applyIncomingRemotePayload(snap.data());
              updateSyncStatusUI('Synced');
            }
          },
          () => {
            updateSyncStatusUI('Local Only');
          }
        );
      }
    }

    async function pullCloudState(key) {
      if (!key) return false;
      try {
        if (!currentUser && rawFirebaseConfig) {
          await initFirebaseSync();
        }
        const docRef = getSyncDocRef(key);
        if (docRef && currentUser) {
          updateSyncStatusUI('Pulling...');
          const snap = await getDoc(docRef);
          if (snap && snap.exists()) {
            applyIncomingRemotePayload(snap.data());
            subscribeToCloudKey(key);
            updateSyncStatusUI('Synced');
            return true;
          }
          subscribeToCloudKey(key);
        }

        updateSyncStatusUI('Pulling...');
        const remote = await pullFallbackSyncState(key);
        if (remote) {
          applyIncomingRemotePayload(remote);
          updateSyncStatusUI('Synced');
          return true;
        }

        const payload = serializeSyncPayload();
        const seeded = await pushFallbackSyncState(key, payload);
        updateSyncStatusUI(seeded ? 'Synced' : 'Local Only');
        return seeded;
      } catch (_) {
        updateSyncStatusUI('Local Only');
        return false;
      }
    }

    function formatTime(sec) {
      const s = Math.max(0, Math.floor(Number.isFinite(sec) ? sec : 0));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const rem = s % 60;
      if (h > 0) {
        return `${h}:${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
      }
      return `${m}:${String(rem).padStart(2, '0')}`;
    }

    function formatDurationBadge(sec) {
      const mins = Math.max(1, Math.round((Number.isFinite(sec) ? sec : 0) / 60));
      return `${mins} min`;
    }

    function updateAdSavedPill() {
      const pill = document.getElementById('adSavedPill');
      if (!pill) return;
      const total = Math.max(0, Math.floor(prefs.adSecondsSaved || 0));
      pill.textContent = total >= 60
        ? `${Math.floor(total / 60)}m ${total % 60}s ads skipped`
        : `${total}s ads skipped`;
    }

          runtime.highShelfFilter.gain.value = prefs.voiceBoost ? 4.5 : 0;

    function toggleEpisodePlayed(epId) {
      if (!Array.isArray(prefs.playedEpisodeIds)) prefs.playedEpisodeIds = [];

    function toggleEpisodeSaved(epId) {
      if (!Array.isArray(prefs.savedEpisodeIds)) prefs.savedEpisodeIds = [];
      const idx = prefs.savedEpisodeIds.indexOf(epId);
      if (idx >= 0) {
        prefs.savedEpisodeIds.splice(idx, 1);

    function extractEpisodeNumber(title) {
      const m = String(title || '').match(/\b(?:ep\.?|episode|#)\s*(\d+)\b/i);
      return m ? parseInt(m[1], 10) : null;
    }

    function sortEpisodesList(list) {
      const order = prefs.librarySortOrder === 'oldest' ? 'oldest' : 'newest';
      return [...list].sort((a, b) => {
        const ta = Date.parse(a.pubDate || '') || 0;
        const tb = Date.parse(b.pubDate || '') || 0;
        if (ta !== tb) {
          return order === 'oldest' ? ta - tb : tb - ta;
        }
        const na = extractEpisodeNumber(a.title);
        const nb = extractEpisodeNumber(b.title);
        if (na !== null && nb !== null && na !== nb) {
          return order === 'oldest' ? na - nb : nb - na;
        }
        return 0;
      });
    }

    function renderScrubberMarkers(ep) {
      const container = document.getElementById('adMarkersLayer');
      if (!container || !ep) return;
      container.innerHTML = '';
      const dur = Math.max(1, runtime.duration || ep.duration || 1);
      (ep.ads || []).forEach(ad => {
        const leftPct = Math.max(0, Math.min(100, (ad.start / dur) * 100));
        const widthPct = Math.max(1, Math.min(100 - leftPct, ((ad.end - ad.start) / dur) * 100));
        const mark = document.createElement('div');
        mark.className = 'ad-marker';
        mark.style.left = `${leftPct}%`;
        mark.style.width = `${widthPct}%`;
        container.appendChild(mark);
      });

    function renderLibrary() {

      const episodesContainer = document.getElementById('libraryEpisodesList');

      const sortBtn = document.getElementById('librarySortBtn');
      const hideBtn = document.getElementById('toggleHideListenedBtn');
      const filterAllBtn = document.getElementById('filterAllBtn');
      const filterShowsBtn = document.getElementById('filterShowsBtn');
      const filterSavedBtn = document.getElementById('filterSavedBtn');
      if (!showsContainer || !episodesContainer) return;

      if (countBadge) {
        countBadge.textContent = `${prefs.subscribedShows.length} ${prefs.subscribedShows.length === 1 ? 'show' : 'shows'}`;
      }
      if (sortBtn) {
        sortBtn.textContent = prefs.librarySortOrder === 'oldest' ? '↕️ Oldest First' : '↕️ Newest First';
      }
      if (hideBtn) {
        hideBtn.textContent = prefs.hideListened ? '🙈 Hide Listened: ON' : '👁️ Hide Listened: OFF';

      const setFilterStyle = (btn, active) => {
        if (!btn) return;
        btn.className = active
          ? 'flex-1 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white'
          : 'flex-1 py-2 rounded-xl text-xs font-bold bg-surface text-slate-400 hover:text-white';
      };
      setFilterStyle(filterAllBtn, prefs.libraryFilter === 'all');
      setFilterStyle(filterShowsBtn, prefs.libraryFilter === 'shows');
      setFilterStyle(filterSavedBtn, prefs.libraryFilter === 'saved');

      const q = String(prefs.librarySearch || '').trim().toLowerCase();
      showsContainer.innerHTML = '';

      const matchingShows = prefs.subscribedShows.filter(show => {
        if (!q) return true;
        return String(show.name || '').toLowerCase().includes(q);
      });

      if (!matchingShows.length) {
        showsContainer.innerHTML = '<p class="text-xs text-slate-500">No matching shows in your library.</p>';
      } else {
        matchingShows.forEach((show, sIdx) => {
          const isExpanded = Boolean(runtime.expandedShowNames[show.name]);
          const isLoading = Boolean(runtime.loadingShowNames[show.name]);
          const showEpsRaw = runtime.episodes.filter(ep => ep.show.toLowerCase() === show.name.toLowerCase());
          const visibleShowEps = sortEpisodesList(showEpsRaw).filter(ep => {
            if (prefs.hideListened && isEpisodePlayed(ep.id)) return false;
            if (q && !ep.title.toLowerCase().includes(q) && !show.name.toLowerCase().includes(q)) return false;
            return true;
          });

          const wrapper = document.createElement('div');
          wrapper.className = 'rounded-xl bg-surface border border-slate-800 overflow-hidden';

          const headerRow = document.createElement('div');
          headerRow.className = 'flex items-center justify-between gap-2 p-3';
          headerRow.innerHTML = `
            <button type="button" class="flex items-center gap-2.5 min-w-0 flex-1 text-left">
              <span class="text-lg">${show.icon || '🎙️'}</span>
              <div class="min-w-0 flex-1">
                <p class="text-xs font-bold text-white truncate">${show.name}</p>
                <p class="text-[11px] text-slate-400">${showEpsRaw.length} episodes • ${isExpanded ? 'Hide' : 'Show episodes'}</p>
              </div>
            </button>
            <button type="button" data-unsub="${sIdx}" class="px-2.5 py-1 rounded-lg bg-card hover:bg-cardAlt text-[11px] text-slate-400 hover:text-rose-400">
              Remove
            </button>
          `;

          headerRow.querySelector('button').addEventListener('click', () => {
            const nextOpen = !runtime.expandedShowNames[show.name];
            runtime.expandedShowNames[show.name] = nextOpen;
            if (nextOpen && !showEpsRaw.length) {
              loadEpisodesForShow(show);
            }
            renderLibrary();
          });

          headerRow.querySelector('[data-unsub]').addEventListener('click', () => {
            prefs.subscribedShows.splice(sIdx, 1);
            savePrefs();
            renderLibrary();
            showToast('Removed show');
          });

          wrapper.appendChild(headerRow);

          if (isExpanded) {
            const epBox = document.createElement('div');
            epBox.className = 'px-3 pb-3 space-y-2 border-t border-slate-800/80 pt-2.5';
            if (isLoading && !visibleShowEps.length) {
              epBox.innerHTML = '<p class="text-xs text-indigo-300">Loading episodes...</p>';
            } else if (!visibleShowEps.length) {
              epBox.innerHTML = '<p class="text-xs text-slate-500">No episodes match current filters.</p>';
            } else {
              visibleShowEps.forEach(ep => {
                const played = isEpisodePlayed(ep.id);
                const saved = isEpisodeSaved(ep.id);
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between gap-2 p-2.5 rounded-xl bg-card border border-slate-800';
                row.innerHTML = `
                  <button type="button" class="text-left min-w-0 flex-1">
                    <p class="text-xs font-semibold text-white truncate ${played ? 'opacity-60 line-through' : ''}">${ep.title}</p>
                    <p class="text-[11px] text-slate-400">${ep.pubDate || ''} • ${formatDurationBadge(ep.duration)}</p>
                  </button>
                  <div class="flex items-center gap-1 shrink-0">
                    <button type="button" data-ep-play="${ep.id}" class="px-2 py-1 rounded-lg bg-indigo-600 text-white text-[11px] font-bold">▶</button>
                    <button type="button" data-ep-played="${ep.id}" class="px-2 py-1 rounded-lg bg-surface text-[11px] ${played ? 'text-emerald-400 font-bold' : 'text-slate-400'}">${played ? 'Listened' : 'Mark'}</button>
                    <button type="button" data-ep-save="${ep.id}" class="px-2 py-1 rounded-lg bg-surface text-xs ${saved ? 'text-amber-300' : 'text-slate-400'}">★</button>
                  </div>
                `;
                const playAction = () => {
                  selectEpisode(ep.id, true);
                  switchTab('player');
                };
                row.querySelector('button').addEventListener('click', playAction);
                row.querySelector('[data-ep-play]').addEventListener('click', playAction);
                row.querySelector('[data-ep-played]').addEventListener('click', () => toggleEpisodePlayed(ep.id));
                row.querySelector('[data-ep-save]').addEventListener('click', () => toggleEpisodeSaved(ep.id));
                epBox.appendChild(row);
              });
            }
            wrapper.appendChild(epBox);
          }

          showsContainer.appendChild(wrapper);
        });
      }

      episodesContainer.innerHTML = '';
      if (prefs.libraryFilter === 'shows') {
        episodesContainer.innerHTML = '<p class="text-xs text-slate-500">Showing subscribed shows above. Switch to All or Saved Eps to view episode list.</p>';
        return;
      }

      const filteredEps = sortEpisodesList(runtime.episodes).filter(ep => {
        if (prefs.libraryFilter === 'saved' && !isEpisodeSaved(ep.id)) return false;
        if (prefs.hideListened && isEpisodePlayed(ep.id)) return false;
        if (q && !ep.title.toLowerCase().includes(q) && !ep.show.toLowerCase().includes(q)) return false;
        return true;
      });

      if (!filteredEps.length) {
        episodesContainer.innerHTML = '<p class="text-xs text-slate-500">No episodes match your current view.</p>';
        return;
      }

      filteredEps.slice(0, 60).forEach(ep => {
        const played = isEpisodePlayed(ep.id);
        const saved = isEpisodeSaved(ep.id);
        const card = document.createElement('div');
        card.className = 'flex items-center justify-between gap-2 p-3 rounded-xl bg-surface border border-slate-800';
        card.innerHTML = `
          <button type="button" class="text-left min-w-0 flex-1">
            <p class="text-xs font-bold text-white truncate ${played ? 'opacity-60 line-through' : ''}">${ep.title}</p>
            <p class="text-[11px] text-slate-400 truncate">${ep.show} • ${ep.pubDate || ''} • ${formatDurationBadge(ep.duration)}</p>
          </button>
          <div class="flex items-center gap-1 shrink-0">
            <button type="button" data-lib-play="${ep.id}" class="px-2.5 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold">Play</button>
            <button type="button" data-lib-played="${ep.id}" class="px-2.5 py-1.5 rounded-lg bg-card text-[11px] ${played ? 'text-emerald-400 font-bold' : 'text-slate-400'}">${played ? 'Listened' : 'Mark'}</button>
            <button type="button" data-lib-save="${ep.id}" class="px-2.5 py-1.5 rounded-lg bg-card text-xs ${saved ? 'text-amber-300' : 'text-slate-400'}">★</button>
          </div>
        `;
        const openPlay = () => {
          selectEpisode(ep.id, true);
          switchTab('player');
        };
        card.querySelector('button').addEventListener('click', openPlay);
        card.querySelector('[data-lib-play]').addEventListener('click', openPlay);
        card.querySelector('[data-lib-played]').addEventListener('click', () => toggleEpisodePlayed(ep.id));
        card.querySelector('[data-lib-save]').addEventListener('click', () => toggleEpisodeSaved(ep.id));
        episodesContainer.appendChild(card);
      });
    }

    function mergeEpisodes(incomingList) {
      const existingByKey = new Map();
      runtime.episodes.forEach(ep => {
        const key = `${ep.show.toLowerCase()}::${ep.title.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim()}`;
        existingByKey.set(key, ep);
      });

      incomingList.forEach(item => {
        if (!item || !item.title) return;
        const key = `${item.show.toLowerCase()}::${item.title.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim()}`;
        if (!existingByKey.has(key)) {
          runtime.episodes.push(item);
          existingByKey.set(key, item);
          if (!runtime.queueIds.includes(item.id)) {
            runtime.queueIds.push(item.id);
          }
        }
      });
    }

    function fetchItunesJsonp(url) {
      return new Promise((resolve) => {
        const cbName = `cf_jsonp_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
        const sep = url.includes('?') ? '&' : '?';
        const script = document.createElement('script');
        const timer = setTimeout(() => {
          cleanup();
          resolve(null);
        }, 7000);

        function cleanup() {
          clearTimeout(timer);
          try { delete window[cbName]; } catch (_) { window[cbName] = undefined; }
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cbName] = (data) => {
          cleanup();
          resolve(data);
        };

        script.src = `${url}${sep}callback=${cbName}`;
        script.onerror = () => {
          cleanup();
          resolve(null);
        };
        document.body.appendChild(script);
      });
    }

    async function fetchEpisodesViaItunesLookup(show) {
      try {
        let collectionId = show.collectionId;
        if (!collectionId) {
          const searchData = await fetchItunesJsonp(
            `https://itunes.apple.com/search?media=podcast&entity=podcast&limit=5&term=${encodeURIComponent(show.name)}`
          );
          const match = searchData?.results?.[0];
          if (match) {
            collectionId = match.collectionId;
            if (match.feedUrl && !show.feedUrl) show.feedUrl = match.feedUrl;
          }
        }
        if (!collectionId) return [];

        const lookupData = await fetchItunesJsonp(
          `https://itunes.apple.com/lookup?id=${encodeURIComponent(collectionId)}&entity=podcastEpisode&limit=200`
        );
        const rows = Array.isArray(lookupData?.results)
          ? lookupData.results.filter(r => r.wrapperType === 'podcastEpisode')
          : [];

        return rows.map((r, idx) => ({
          id: `itunes-${collectionId}-${r.trackId || idx}`,
          show: show.name,
          icon: show.icon || '🎙️',
          title: r.trackName || `Episode ${idx + 1}`,
          pubDate: r.releaseDate ? String(r.releaseDate).slice(0, 10) : '',
          duration: r.trackTimeMillis ? Math.round(r.trackTimeMillis / 1000) : 1800,
          audioUrl: r.episodeUrl || '',
          description: r.shortDescription || r.description || '',
          chapters: [{ start: 0, title: 'Full Episode' }],
          ads: []
        }));
      } catch (_) {
        return [];
      }
    }

    async function loadEpisodesForShow(show) {
      if (!show || !show.name) return;
      runtime.loadingShowNames[show.name] = true;
      renderLibrary();

      try {
        const itunesEps = await fetchEpisodesViaItunesLookup(show);
        if (itunesEps.length) {
          mergeEpisodes(itunesEps);
        }
      } finally {
        runtime.loadingShowNames[show.name] = false;
        renderLibrary();
        renderQueue();
      }
    }

    async function subscribeToShowInput(rawValue) {
      const val = String(rawValue || '').trim();
      if (!val) {
        showToast('Enter a podcast name, Apple link, or RSS URL');
        return;
      }

      let showName = val;
      let feedUrl = '';
      let collectionId = null;

      if (/^https?:\/\//i.test(val)) {
        const appleIdMatch = val.match(/id(\d+)/i);
        if (appleIdMatch) {
          collectionId = appleIdMatch[1];
          const lookupData = await fetchItunesJsonp(`https://itunes.apple.com/lookup?id=${encodeURIComponent(collectionId)}`);
          const pod = lookupData?.results?.[0];
          if (pod?.collectionName) showName = pod.collectionName;
          if (pod?.feedUrl) feedUrl = pod.feedUrl;
        } else {
          feedUrl = val;
          try {
            showName = new URL(val).hostname.replace(/^www\./, '');
          } catch (_) {
            showName = 'Custom Feed';
          }
        }
      } else {
        const searchData = await fetchItunesJsonp(
          `https://itunes.apple.com/search?media=podcast&entity=podcast&limit=1&term=${encodeURIComponent(val)}`
        );
        const match = searchData?.results?.[0];
        if (match) {
          showName = match.collectionName || val;
          feedUrl = match.feedUrl || '';
          collectionId = match.collectionId || null;
        }
      }

      const existing = prefs.subscribedShows.find(s => s.name.toLowerCase() === showName.toLowerCase());
      const showObj = existing || { name: showName, icon: '🎙️', feedUrl, collectionId };
      if (!existing) {
        prefs.subscribedShows.push(showObj);
      } else {
        if (feedUrl && !existing.feedUrl) existing.feedUrl = feedUrl;
        if (collectionId && !existing.collectionId) existing.collectionId = collectionId;
      }

      prefs.libraryFilter = 'all';
      prefs.librarySearch = '';
      const searchEl = document.getElementById('librarySearchInput');
      if (searchEl) searchEl.value = '';
      runtime.expandedShowNames[showObj.name] = true;

      savePrefs();
      renderLibrary();
      showToast(`Followed ${showObj.name}`);
      await loadEpisodesForShow(showObj);
    }

    function selectEpisode(epId, autoplay = false) {
      const ep = runtime.episodes.find(e => e.id === epId) || runtime.episodes[0];
      if (!ep) return;
      runtime.currentEpisodeId = ep.id;
      runtime.duration = ep.duration || 1800;
      runtime.currentTime = 0;
      runtime.lastTickTime = null;

      if (ep.audioUrl) {
        audioEl.src = ep.audioUrl;
        audioEl.playbackRate = prefs.speed;
      } else {
        audioEl.removeAttribute('src');
      }

      renderPlayerHeader(ep);
      renderScrubberMarkers(ep);
      renderExtras(ep);
      renderQueue();
      updateTimeUI();
      setPlaying(autoplay);
    }

    function setPlaying(playState) {
      const ep = currentEpisode();
      if (!ep) return;
      runtime.isPlaying = Boolean(playState);
      runtime.lastTickTime = performance.now();

      const playBtn = document.getElementById('playPauseBtn');
      const carPlayBtn = document.getElementById('carModePlayBtn');
      if (playBtn) playBtn.textContent = runtime.isPlaying ? '⏸' : '▶';
      if (carPlayBtn) carPlayBtn.textContent = runtime.isPlaying ? '⏸' : '▶';

      if (ep.audioUrl && audioEl.src) {
        if (runtime.isPlaying) {
          audioEl.playbackRate = prefs.speed;
          audioEl.play().catch(() => {});
        } else {
          audioEl.pause();
        }
      }
    }

    function seekTo(sec) {
      const clamped = Math.max(0, Math.min(runtime.duration || 1800, Number(sec) || 0));
      runtime.currentTime = clamped;
      if (audioEl && audioEl.src && Number.isFinite(audioEl.duration)) {
        try { audioEl.currentTime = clamped; } catch (_) {}
      }
      updateTimeUI();
    }

    function updateTimeUI() {
      const dur = Math.max(1, runtime.duration || 1800);
      const cur = Math.max(0, Math.min(dur, runtime.currentTime || 0));
      const pct = (cur / dur) * 100;
      const fill = document.getElementById('progressFill');
      const curLbl = document.getElementById('currentTimeLabel');
      const durLbl = document.getElementById('durationLabel');
      if (fill) fill.style.width = `${pct}%`;
      if (curLbl) curLbl.textContent = formatTime(cur);
      if (durLbl) durLbl.textContent = formatTime(dur);
    }

    function tickPlayback(now) {
      if (runtime.isPlaying) {
        if (runtime.lastTickTime === null) runtime.lastTickTime = now;
        const dtSec = ((now - runtime.lastTickTime) / 1000) * (prefs.speed || 1);
        runtime.lastTickTime = now;

        const ep = currentEpisode();
        if (ep && ep.audioUrl && audioEl.src && !audioEl.paused) {
          runtime.currentTime = audioEl.currentTime || runtime.currentTime + dtSec;
          if (Number.isFinite(audioEl.duration) && audioEl.duration > 0) {
            runtime.duration = audioEl.duration;
          }
        } else {
          runtime.currentTime += dtSec;
        }

        if (ep && prefs.autoSkipAds && Array.isArray(ep.ads)) {
          for (const ad of ep.ads) {
            if (runtime.currentTime >= ad.start && runtime.currentTime < ad.end - 0.5) {
              const skippedSec = Math.max(1, Math.round(ad.end - runtime.currentTime));
              runtime.lastSkippedAd = { returnTime: ad.start, skippedSec };
              prefs.adSecondsSaved = (prefs.adSecondsSaved || 0) + skippedSec;
              updateAdSavedPill();
              seekTo(ad.end);
              savePrefs();
              showToast(`Skipped ${ad.label || 'ad'} (${skippedSec}s saved)`, true);
              break;
            }
          }
        }

        if (runtime.currentTime >= runtime.duration) {
          if (ep && !isEpisodePlayed(ep.id)) {
            toggleEpisodePlayed(ep.id);
          }
          const curIdx = runtime.queueIds.indexOf(ep?.id);
          const nextId = runtime.queueIds[curIdx + 1];
          if (nextId) {
            selectEpisode(nextId, true);
          } else {
            setPlaying(false);
            seekTo(0);
          }
        } else {
          updateTimeUI();
        }
      } else {
        runtime.lastTickTime = now;
      }

      requestAnimationFrame(tickPlayback);
    }

    function switchTab(tabName) {
      const valid = ['player', 'queue', 'library', 'extras'];
      const target = valid.includes(tabName) ? tabName : 'player';
      prefs.activeTab = target;

      const views = {
        player: document.getElementById('viewPlayer'),
        queue: document.getElementById('viewQueue'),
        library: document.getElementById('viewLibrary'),
        extras: document.getElementById('viewExtras')
      };
      Object.entries(views).forEach(([key, el]) => {
        if (el) el.classList.toggle('hidden', key !== target);
      });

      const tabs = {
        player: document.getElementById('tabPlayerBtn'),
        queue: document.getElementById('tabQueueBtn'),
        library: document.getElementById('tabLibraryBtn'),
        extras: document.getElementById('tabExtrasBtn')
      };
      Object.entries(tabs).forEach(([key, btn]) => {
        if (!btn) return;
        const active = key === target;
        btn.className = active
          ? 'flex flex-col items-center justify-center py-2 rounded-xl bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 text-xs font-bold'
          : 'flex flex-col items-center justify-center py-2 rounded-xl text-slate-400 hover:text-white text-xs font-semibold';
      });
    }

    async function initApp() {
      loadPrefsForKey(activeSyncKey);
      runtime.episodes = buildDemoEpisodes();
      runtime.queueIds = runtime.episodes.map(e => e.id);
      runtime.currentEpisodeId = runtime.episodes[0]?.id || null;

      syncControlsFromPrefs();
      selectEpisode(runtime.currentEpisodeId, false);
      renderLibrary();
      renderQueue();
      switchTab(prefs.activeTab || 'player');

      await initFirebaseSync();
      await pullCloudState(activeSyncKey);
      for (const show of prefs.subscribedShows || []) {
        if (show && show.name) {
          await loadEpisodesForShow(show);
        }
      }

      setInterval(() => {
        if (activeSyncKey && !document.hidden) {
          pullCloudState(activeSyncKey);
        }
      }, 10000);

      requestAnimationFrame(tickPlayback);
    }

    document.getElementById('tabPlayerBtn').addEventListener('click', () => switchTab('player'));
    document.getElementById('tabQueueBtn').addEventListener('click', () => switchTab('queue'));
    document.getElementById('tabLibraryBtn').addEventListener('click', () => switchTab('library'));
    document.getElementById('tabExtrasBtn').addEventListener('click', () => switchTab('extras'));

    document.getElementById('playPauseBtn').addEventListener('click', () => setPlaying(!runtime.isPlaying));
    document.getElementById('carModePlayBtn').addEventListener('click', () => setPlaying(!runtime.isPlaying));
    document.getElementById('rewind15Btn').addEventListener('click', () => seekTo(runtime.currentTime - 15));
    document.getElementById('carRewindBtn').addEventListener('click', () => seekTo(runtime.currentTime - 15));
    document.getElementById('forward30Btn').addEventListener('click', () => seekTo(runtime.currentTime + 30));
    document.getElementById('carForwardBtn').addEventListener('click', () => seekTo(runtime.currentTime + 30));

    document.getElementById('carModeBtn').addEventListener('click', () => {
      document.getElementById('carModeOverlay').classList.remove('hidden');
    });
    document.getElementById('exitCarModeBtn').addEventListener('click', () => {
      document.getElementById('carModeOverlay').classList.add('hidden');
    });

    document.getElementById('scrubberTrack').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / Math.max(1, rect.width)));
      seekTo(ratio * (runtime.duration || 1800));
    });

    document.getElementById('speedRange').addEventListener('input', (e) => setSpeed(e.target.value));

    document.getElementById('toggleAutoSkipAds').addEventListener('change', (e) => {
      prefs.autoSkipAds = e.target.checked;
      savePrefs();
    });
    document.getElementById('toggleSilenceTrim').addEventListener('change', (e) => {
      prefs.silenceTrim = e.target.checked;
      applyAudioSettings();
      savePrefs();
    });
    document.getElementById('toggleVoiceBoost').addEventListener('change', (e) => {
      prefs.voiceBoost = e.target.checked;
      applyAudioSettings();
      savePrefs();
    });

    document.getElementById('toastUndoBtn').addEventListener('click', () => {
      if (runtime.lastSkippedAd) {
        prefs.adSecondsSaved = Math.max(0, (prefs.adSecondsSaved || 0) - runtime.lastSkippedAd.skippedSec);
        seekTo(runtime.lastSkippedAd.returnTime);
        runtime.lastSkippedAd = null;
        updateAdSavedPill();
        savePrefs();
        document.getElementById('toastBanner').classList.add('hidden');
      }
    });

    document.getElementById('clearQueueBtn').addEventListener('click', () => {
      runtime.queueIds = [];
      renderQueue();
    });

    document.getElementById('libraryFollowBtn').addEventListener('click', () => {
      const input = document.getElementById('libraryFeedInput');
      if (!input) return;
      const val = input.value;
      input.value = '';
      subscribeToShowInput(val);
    });

    document.getElementById('libraryFeedInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('libraryFollowBtn').click();
      }
    });

    document.getElementById('librarySearchInput').addEventListener('input', (e) => {
      prefs.librarySearch = e.target.value;
      renderLibrary();
    });

    document.getElementById('filterAllBtn').addEventListener('click', () => {
      prefs.libraryFilter = 'all';
      renderLibrary();
    });
    document.getElementById('filterShowsBtn').addEventListener('click', () => {
      prefs.libraryFilter = 'shows';
      renderLibrary();
    });
    document.getElementById('filterSavedBtn').addEventListener('click', () => {
      prefs.libraryFilter = 'saved';
      renderLibrary();
    });

    document.getElementById('librarySortBtn').addEventListener('click', () => {
      prefs.librarySortOrder = prefs.librarySortOrder === 'oldest' ? 'newest' : 'oldest';
      savePrefs();
      renderLibrary();
    });

    document.getElementById('toggleHideListenedBtn').addEventListener('click', () => {
      prefs.hideListened = !prefs.hideListened;
      savePrefs();
      renderLibrary();
    });

    document.getElementById('copySyncKeyBtn').addEventListener('click', () => {
      const baseUrl = `${window.location.origin}${window.location.pathname}`;
      const shareUrl = `${baseUrl}?sync=${encodeURIComponent(activeSyncKey)}`;
      try {
        const tempInput = document.createElement('input');
        tempInput.value = shareUrl;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        showToast('Sync link copied');
      } catch (_) {
        showToast(`Sync key: ${activeSyncKey}`);
      }
    });

    document.getElementById('applySyncKeyBtn').addEventListener('click', async () => {
      const input = document.getElementById('syncKeyInput');
      if (!input) return;
      const nextKey = input.value.trim();
      if (!nextKey) return;
      loadPrefsForKey(nextKey);
      syncControlsFromPrefs();
      renderLibrary();
      renderQueue();
      await pullCloudState(nextKey);
      showToast('Switched sync profile');
    });

    document.getElementById('addBookmarkBtn').addEventListener('click', () => {
      const ep = currentEpisode();
      if (!ep) return;
      const noteInput = document.getElementById('bookmarkNoteInput');
      const note = noteInput ? noteInput.value.trim() : '';
      if (!prefs.bookmarks[ep.id]) prefs.bookmarks[ep.id] = [];
      prefs.bookmarks[ep.id].push({ time: Math.floor(runtime.currentTime), note });
      if (noteInput) noteInput.value = '';
      savePrefs();
      renderExtras(ep);
      showToast('Bookmark saved');
    });

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
